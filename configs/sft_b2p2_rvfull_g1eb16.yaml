# B2p2 SFT2 (C) — T1-IDENTICAL RV corpus. Replaces the 378-row filtered top-up.
#
# WHY (E-093 / E-094 / E-095). The previous SFT2 trained on a 378-row filter of
# this same corpus. Three audits showed that filter was not what it claimed:
#   E-093  its `think-closed` condition is a COVERT SCENARIO FILTER — `</think>`
#          only ever arrives inside the force-fed wrong_prefix (0 of 1763 rows
#          emit it in the generated recovery), and the redirect scenario cuts the
#          prefix mid-think by construction, so redirect fell 554 -> 67 (1/8.3).
#   E-094  the filter also INVERTED the meta position relative to SFT1. SFT1
#          (b2on_v8meta_strict_sft) is 100% meta-INSIDE-think; the 378 rows are
#          0% meta-inside. The top-up was undoing the structure SFT1 had just
#          installed, and it discarded F011 (726 rows) which holds 69% of all
#          redirect rows AND matches SFT1's meta position.
#   E-095  render-layer token-id audit of THIS corpus: 0% truncation at 4096
#          (max 3184 tokens), 100% of rows keep the final \boxed answer inside
#          the trained region, 100% terminate with EOS. 524 rows (29.7%) have the
#          meta block swallowed by the masked wrong_prefix and so teach nothing
#          about meta emission — but T1 trained on those too, and won.
#
# So this config is T1's SFT2 recipe verbatim (archive/launchers_pre_rq3/
# h100std_rv_functional_sft.yaml + configs/archive/sft_rv_functional.yaml):
# the RAW 1763-row corpus, 3 epochs, lr 1e-5, max_length 4096 — differing from
# T1 ONLY in the init (base-native SFT1 instead of the instruct one) and the
# output name. Every filter we invented was an unvalidated deviation, and the
# audits showed those deviations were harmful; a literal replication leaves no
# room to blame a deviation if the base result comes out negative.
#
# sft.py auto-segment-masks because wrong_prefix is nonempty: prompt + flawed
# prefix are masked, only meta + recovery are trained (sft.py:111-116).
#
# The G5-gated 1239-row variant (drop the 524 meta-dead rows) is the planned
# SECOND attempt, not this one — see E-095 "발사 순서".
#
# OUTPUT NAME IS DELIBERATELY NEW (`b2p2_rvfull_sft`, not `b2p2_rvseg_sft`):
# the running b2p/b3p arms stage their RL init from HF models/b2p2_rvseg_sft, so
# reusing that name would silently swap the init under any resubmitted arm.
model_name_or_path: /scratch/models/b2p_v8meta_strict_sft
dataset_path: data/rv_redirect_verify_functional.parquet
output_dir: /scratch/checkpoints/b2p2_rvfull_eb16_sft   # ABSOLUTE (0708 stranded-ckpt guard)
run_name: b2p2-rvfull-sft2-eb16
wandb_project: metacot-math

num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
max_length: 4096
save_strategy: steps
save_steps: 25
save_total_limit: 2
eval_strategy: "no"

# Preemption posture, stated honestly: this config does NOT set
# `resume_from_checkpoint`, so sft.py resolves it to None and every launch is a
# cold start (sft.py:375-377). Auto-resume was left off on purpose — the
# launcher has no step that pulls a checkpoint back from HF, so a resumed run
# could only ever find state on a node that never died, which is the case that
# does not need resuming. What save_steps 25 buys instead is a manual escape
# hatch: a local checkpoint exists within ~15 min of start, so a job seen to be
# in danger can have its checkpoint pushed to HF by hand before the node goes.

# ── 0727 EFFECTIVE-BATCH FIX ────────────────────────────────────────────────
# T1's SFT2 ran bs1 x ga16 on 1 GPU (effective 16, see 0727 fix below) on FOUR processes => effective batch 16
# (configs/archive/sft_rv_functional.yaml:20-21 + configs/accelerate_sft.yaml:13).
# The 1-GPU variant created on 0727 to escape the 11-12h queue kept ga=4, which
# on one process is effective batch 4 — a silent 4x deviation from the recipe we
# are trying to replicate literally. Step count confirms it: 1763 rows x 3 epochs
# / 4 = 1322 steps, and the live job reported 1212 (after length filtering),
# whereas batch 16 gives ~330.
# ga is raised to 16 here so ONE process reproduces T1's effective batch exactly.
# Memory is unaffected: gradient accumulation runs micro-batches sequentially and
# per_device_train_batch_size stays 1.
# Invariant to preserve: effective batch MUST be 16 at every world size, so both
# arms are optimised identically and both match T1.
#     1 GPU -> ga 16      2 GPUs -> ga 8      4 GPUs -> ga 4
