# B0p2 SFT2 — the MISSING second stage of the control arm.
#
# WHY THIS EXISTS (found 0726, E-097). The think-on matched ladder was two-stage
# on the meta side and ONE-stage on the control side:
#
#   b2p/b3p : SFT1 b2p_v8meta_strict_sft  ->  SFT2 (RV corpus, meta)  ->  RL
#   b0p     : SFT1 b0p_v8base_strict_sft  ->  (nothing)               ->  RL
#
# HF `iamseungpil/metacot` models/ confirms it: there is no b0p2_* checkpoint.
# So the replication axis b3p - b0p currently conflates the thing we want to
# measure (the meta mechanism) with a thing we do not (one extra SFT pass over
# the RV corpus). That is exactly the confound the matched ladder exists to
# remove, and it is the same trap already flagged for RQ1 ("RQ1은 meta-init
# 효과가 아니라 corpus까지 다른 SFT 비교").
#
# The fix needs no new data: `scripts/build_base_rv_sft_data.py` was written for
# precisely this ("the META-REMOVED TWIN of the rv_functional SFT corpus (base
# SFT-2 data)") and its output has been sitting on HF unused. Verified 0726:
#   - 1763 rows, EXACT 1:1 with the meta corpus (no rows dropped)
#   - 0 `<|meta|>` / `<|/meta|>` substrings (the build script's hard invariant)
#   - identical scenario split (verify 1209 / redirect 554)
#   - identical think-closed rate 41.2% (stripping meta cannot touch </think>)
#   - wrong_prefix nonempty 100% -> sft.py segment-masks IDENTICALLY to the meta
#     arm, so the two arms train on the same spans minus the meta block
#   - render-layer audit (scripts/audit_sft2_render_mask.py): 0% truncation at
#     4096 (max 3124 tokens), 100% keep the final \boxed answer in the trained
#     region, 100% terminate with EOS. G3/G5 report N/A by construction — they
#     are meta-specific gates and this corpus has no meta block.
#
# Dose is matched to the meta arm's (C) run (configs/sft_b2p2_rvfull.yaml):
# 3 epochs, lr 1e-5, max_length 4096, bs1 x ga16 on 1 GPU (effective 16, see 0727 fix below) — so the only difference between
# the arms at this stage is the presence of the meta block.
model_name_or_path: /scratch/models/b0p_v8base_strict_sft
dataset_path: data/v8_base_rv_sft.parquet
output_dir: /scratch/checkpoints/b0p2_rvfull_eb16_sft   # ABSOLUTE (0708 stranded-ckpt guard)
run_name: b0p2-rvfull-sft2-eb16
wandb_project: metacot-math

num_train_epochs: 3
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
learning_rate: 1.0e-5
max_length: 4096
save_strategy: steps
save_steps: 25
save_total_limit: 2
eval_strategy: "no"

# Preemption posture, stated honestly: this config does NOT set
# `resume_from_checkpoint`, so sft.py resolves it to None and every launch is a
# cold start (sft.py:375-377). Auto-resume was left off on purpose — the
# launcher has no step that pulls a checkpoint back from HF, so a resumed run
# could only ever find state on a node that never died, which is the case that
# does not need resuming. What save_steps 25 buys instead is a manual escape
# hatch: a local checkpoint exists within ~15 min of start, so a job seen to be
# in danger can have its checkpoint pushed to HF by hand before the node goes.

# ── 0727 EFFECTIVE-BATCH FIX ────────────────────────────────────────────────
# T1's SFT2 ran bs1 x ga16 on 1 GPU (effective 16, see 0727 fix below) on FOUR processes => effective batch 16
# (configs/archive/sft_rv_functional.yaml:20-21 + configs/accelerate_sft.yaml:13).
# The 1-GPU variant created on 0727 to escape the 11-12h queue kept ga=4, which
# on one process is effective batch 4 — a silent 4x deviation from the recipe we
# are trying to replicate literally. Step count confirms it: 1763 rows x 3 epochs
# / 4 = 1322 steps, and the live job reported 1212 (after length filtering),
# whereas batch 16 gives ~330.
# ga is raised to 16 here so ONE process reproduces T1's effective batch exactly.
# Memory is unaffected: gradient accumulation runs micro-batches sequentially and
# per_device_train_batch_size stays 1.
# Invariant to preserve: effective batch MUST be 16 at every world size, so both
# arms are optimised identically and both match T1.
#     1 GPU -> ga 16      2 GPUs -> ga 8      4 GPUs -> ga 4
