description: "T1-CALIBRATION probe (E-077). Runs the IDENTICAL measure_sft_gate (same seed 42, decoy_seed 42, math500-300, n_pmi 200, 8k) on the T1-WINNING instruct init models/v8_rv_functional_sft (from iamseungpil/metacot-rv) to calibrate the pmi auc threshold: if T1 also scores ~0.5, the SFT-probe does not predict RL engagement and we GO to RL from b2p2; if T1 >=0.55, our SFT2 graft genuinely failed. Direct instruct-vs-base comparison per user directive. H100x4 Standard, short."

target:
  service: sing
  name: msrresrchbasicvc
  workspace_name: msra-sh-aml-ws

environment:
  registry: mcr.microsoft.com
  image: aifx/acpt/stable-ubuntu2204-cu126-py310-torch28x:latest

code:
  local_dir: $CONFIG_DIR/

jobs:
  - name: probe_t1_gate
    sku: 80G4-H100
    sla_tier: Standard
    priority: high
    identity: managed
    submit_args:
      max_run_duration_seconds: 259200
      env:
        _AZUREML_SINGULARITY_JOB_UAI: "/subscriptions/c4c534bc-9978-4974-9c87-551f7c5754ef/resourceGroups/msra-sh-aml-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/msra-sh-aml-uai"
        HF_TOKEN: ${HF_TOKEN}
        GH_TOKEN: ${GH_TOKEN}
        CODE_TAR_REVISION: "487971950"
        HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
        WANDB_API_KEY: ${WANDB_API_KEY}
        WANDB_KEY: ${WANDB_API_KEY}
        WANDB_PROJECT: metacot-math
        WANDB_RUN_GROUP: rq3v2_thinkon
        WANDB_NAME: t1_gate_probe
        WANDB_TAGS: rq3v2,thinkon,pmi-probe,gate
        HF_HUB_DISABLE_XET: "1"
        SIMPLERL_DIR: /scratch/conda_envs/simplerl
    command:
      - nvidia-smi
      - |
        bash -c '
        set +e
        set -x
        mkdir -p /scratch/logs /scratch/checkpoints /scratch/models
        cd /scratch
        source /opt/conda/etc/profile.d/conda.sh
        conda activate ptca
        nohup python -c "
        import torch, time
        g = torch.cuda.device_count()
        ts = [torch.randn(2048, 2048, device=i, dtype=torch.float16) for i in range(g)]
        while True:
            for i in range(g): ts[i] = (ts[i] @ ts[i]) * 0.5
            time.sleep(2)
        " > /scratch/logs/gpu_keeper_inline.log 2>&1 &
        pip install -q "huggingface_hub<1.0" 2>&1 | tail -1

        curl -fsSL -H "Authorization: token $${GH_TOKEN}" -H "Accept: application/octet-stream" -o /tmp/metacognition.tar.gz https://api.github.com/repos/iamseungpil/metacognition-math/releases/assets/$${CODE_TAR_REVISION}
        tar -xzf /tmp/metacognition.tar.gz -C /scratch

        nohup python /scratch/metacognition/scripts/gpu_keeper.py > /scratch/logs/gpu_keeper_early.log 2>&1 &
        bash /scratch/metacognition/scripts/bootstrap_sdc_node.sh
        export PATH="$${SIMPLERL_DIR}/bin:$${PATH}"
        export CONDA_PREFIX="$${SIMPLERL_DIR}"
        pip uninstall -y hf_xet 2>&1 | tail -1 || true
        find $${SIMPLERL_DIR}/lib -maxdepth 3 -name "hf_xet*" -exec rm -rf {} + 2>/dev/null || true

        # stage the durable b2p init from HF (retry + verify pattern, E-069 network-hiccup guard)
        python -c "
        import os, time, shutil
        from huggingface_hub import snapshot_download
        dst = \"/scratch/models/v8_rv_functional_sft\"
        for attempt in range(5):
            try:
                p = snapshot_download(\"iamseungpil/metacot-rv\", repo_type=\"dataset\", token=os.environ[\"HF_TOKEN\"], allow_patterns=[\"models/v8_rv_functional_sft/*\"])
                src = os.path.join(p, \"models\", \"v8_rv_functional_sft\")
                shutil.copytree(src, dst, dirs_exist_ok=True)
                assert os.path.exists(os.path.join(dst, \"config.json\")), \"config.json missing\"
                print(\"staged b2p init OK\")
                break
            except Exception as e:
                print(\"stage attempt\", attempt, \"failed:\", repr(e)[:120])
                time.sleep(20 * (attempt + 1))
        "
        ls -l /scratch/models/v8_rv_functional_sft/ | head -5

        export PYTHONPATH=/scratch/metacognition
        cd /scratch/metacognition

        python scripts/measure_sft_gate.py \
            --model_path /scratch/models/v8_rv_functional_sft \
            --output_dir /scratch/logs/t1_gate \
            --model_name v8_rv_functional_sft \
            --benchmarks math500 \
            --max_problems 300 \
            --max_tokens 8192 \
            --tp_size 4 \
            --n_pmi 200
        GATE_RC=$$?
        echo "[YAML][gate] measure_sft_gate rc=$${GATE_RC}"
        echo "[YAML][gate] ---- gate summary json ----"
        cat /scratch/logs/t1_gate/sft_gate.json 2>/dev/null | head -120

        for i in $$(seq 1 10); do
            python /scratch/metacognition/scripts/push_models_hf.py --model_path /scratch/logs/t1_gate --model_name t1_gate_probe --repo_id iamseungpil/metacot-rv 2>&1 | tail -3
            N=$$(python -c "from huggingface_hub import HfApi;import os;fs=HfApi().list_repo_files(\"iamseungpil/metacot-rv\",repo_type=\"dataset\",token=os.environ[\"HF_TOKEN\"]);print(sum(1 for f in fs if \"t1_gate_probe/\" in f))")
            echo "[YAML][push] attempt $$i: gate_files_on_hf=$$N"
            [ "$$N" != "0" ] && echo "[YAML][push] gate results durable" && break
            sleep 60
        done
        sleep 43200
        '
