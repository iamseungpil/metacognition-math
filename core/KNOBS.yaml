# core/KNOBS.yaml — the load-bearing knob registry
#
# WHY THIS FILE EXISTS
#   E-171 (docs/reports/2026-07-17-rq3-run-and-iteration-log.md:2339) established the
#   failure shape: a switch turned off on 2026-06-22 for one experiment (cf_group)
#   silently invalidated the back half of a different experiment (pmi_shift) six weeks
#   later. The matched-arm audit compared the three launchers byte-for-byte and could
#   not see it, because the knob lives in an INHERITED config. Quoting E-171 §5:
#   "런처만 비교하면 상속된 노브는 영원히 안 보인다" — comparing launchers only, an
#   inherited knob is never visible.
#   This registry is the resolved layer. Every dcpo_* name the training code reads is
#   listed here with where it is actually set, what it defaults to, and whether any
#   currently-running arm reaches it.
#
# SCOPE / METHOD
#   Enumerated by: grep -rhoE '"dcpo_[a-z_0-9]+"' src/training/*.py | sort -u
#   -> 85 unique names. Every file:line below was opened and verified, not inferred.
#   The grep catches two different things and conflating them is itself a hazard, so
#   each entry carries `kind`:
#     kind: knob     — read from algorithm config (config.get / _v4_read / read_knob /
#                      getattr(config.algorithm, ...)). Operator-settable.
#     kind: channel  — a non_tensor_batch / batch key written and read inside one
#                      training step. NOT operator-settable; listed because the grep
#                      returns it and because a Phase-2 reader will otherwise mistake
#                      it for a knob.
#
# STATUS VOCABULARY
#   live          — reached on a currently-running arm.
#   default-only  — reached on a currently-running arm, but NO config or launcher sets
#                   it; the code default is the operating value. This is the most
#                   dangerous class: the value is load-bearing and invisible.
#   dead-lineage  — belongs to a retired generation; not reached on any running arm.
#
# WHAT "RUNNING" MEANS HERE (verified 2026-08-03)
#   solid-gibbon = h100std_rq3v2f_b0p.yaml  -> --config-name=base_matched_grpo_h100_4x4k  (:268)
#   hip-hound    = h100std_rq3v2f_b2p.yaml  -> --config-name=base_matched_grpo_h100_4x4k  (:262)
#   pure-stag    = h100std_rq3v2f_b3p.yaml  -> --config-name=triobj_dcpo_v4_stage3b_h100_4x4k (:246)
#
#   ★ b0p and b2p run algorithm.sdc_mode: VANILLA_GRPO
#     (configs/base_matched_grpo_h100_4x4k.yaml:66). The whole DCPO region-routing
#     block is gated on _REGION_ROUTED_MODES = {TRIOBJ_DCPO_V2, V3, V4}
#     (src/training/verl_sdc.py:1458). VANILLA_GRPO is not in that set, so
#     TWO OF THE THREE RUNNING ARMS READ ZERO dcpo_* KNOBS.
#     "live" in this file therefore means "reached by pure-stag (b3p)" unless noted.
#
#   ★ b3p overrides dcpo_rmeta_source=pmi_shift (h100std_rq3v2f_b3p.yaml:251), while the
#     config it inherits declares dcpo_rmeta_source: cf_group
#     (configs/triobj_dcpo_v4_stage3b_h100_4x4k.yaml:175). Every knob the config sets
#     FOR cf_group and FOR pmi is therefore set-but-never-read on the live arm. Reading
#     the config alone gives the wrong answer about what is on. That is the second
#     instance of the same class of error as E-171.
#
# CONFIG INHERITANCE CHAIN (verified)
#   base_matched_grpo_h100_4x4k.yaml:29  defaults: [verl_e4_selfdistill_h200_4x4k, _self_]
#   triobj_dcpo_v4_stage3b_h100_4x4k.yaml:47 defaults: [verl_e4_selfdistill_h200_4x4k, _self_]
#   verl_e4_selfdistill_h200_4x4k.yaml:21   defaults: [verl_sdc_e21r_shared, _self_]
#   -> anything not named in the leaf config comes from two files up.

version: 1
authored: 2026-08-03
authored_by: Phase-1 registry pass (no code moved; core/ contains this file only)
enumeration:
  command: "grep -rhoE '\"dcpo_[a-z_0-9]+\"' src/training/*.py | sort -u"
  unique_names: 85
  of_which_config_knobs: 60
  of_which_batch_channels: 25
  coverage: "all 85 names appear exactly once below; verified by parsing this file and
    diffing its dcpo_* keys against the grep output — 0 missing, 0 invented"

# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 1 — LOAD-BEARING
# Entries here carry the two mandatory fields. A knob is load-bearing when turning it
# off changes a headline number and we have the measurement that says so.
# ═══════════════════════════════════════════════════════════════════════════════

load_bearing:

  dcpo_meta_floor:
    kind: knob
    status: live
    reached_by: [b3p]
    set_at: "configs/triobj_dcpo_v4_stage3b_h100_4x4k.yaml:154  (value 0.0)"
    code_default: "0.0 at src/training/verl_sdc_utils.py:481  (config.get(\"dcpo_meta_floor\", 0.0))"
    default: 0.0
    # ★ THE DEFECT THAT MAKES THIS THE FIRST ENTRY
    indistinguishable_states: |
      The code default equals the disabled value. Deleting the key from the config and
      explicitly disabling the guard produce the SAME observable state: no log line, no
      warning, no diff in any dashboard panel. There is no way to tell "nobody set this"
      from "somebody decided to turn it off" by looking at a run. Every other guard in
      this repo should be audited for the same property.
    history:
      - "1eae74e (2026-06-15) meta_floor 0.05 — guard ON"
      - "f1f6cec (2026-06-22 00:08 UTC) meta_floor 0.05 -> 0.0 — guard OFF, as a side effect
         of cf_group work. The commit message says 'All new knobs default-OFF => pre-existing
         configs byte-identical'; that claim is true of the NEW knobs and false of this one,
         which is pre-existing and was changed in the same commit."
      - "6537775 (2026-06-22 03:10 UTC) same value, cf_group placebo follow-up"
      - "6a12ae4 (2026-07-12) unchanged at 0.0 through the rq3 ladder build"
    the_config_predicted_this:
      # The justification for 0.0 is written in the file and does not hold for this run.
      comment_above_it: "configs/triobj_dcpo_v4_stage3b_h100_4x4k.yaml:151-153 — 'FLOOR STAYS
        (review I1), reduced 0.1 -> 0.05: ... hold the channel open under the length/format
        pressure while the centered delta grades content.'"
      value_on_the_next_line: "configs/triobj_dcpo_v4_stage3b_h100_4x4k.yaml:154 — 0.0"
      stated_reason: "'cf_group (2026-06-21) 0.05 -> 0.0: the counterfactual answer-delta is
        the emit-when-useful gradient'"
      why_the_reason_fails_here: "b3p does not run cf_group. h100std_rq3v2f_b3p.yaml:251
        overrides dcpo_rmeta_source=pmi_shift. The counterfactual answer-delta that was
        supposed to replace the floor is never computed on this arm."
      review_I1_named_the_outcome_in_advance: "configs/triobj_dcpo_v4_stage3b_h100_4x4k.yaml:35-36
        — 'centered delta is mean-zero => no standing emission pull; removing the floor
        reopens the v3l collapse'. The collapse reopened."
    disabling_failure: |
      With meta_floor=0.0 there is no unconditional standing pull on meta emission, and
      every force that survives is either conditional or centered to zero, while every
      force against emission is unconditional (E-170, log:2256, force-direction table):
        pmi_shift w_meta 0.8  -> centered over PMI-scored rows only => mean 0, no emit pull
        w_format 0.35         -> only paid IF you emit; silence scores 0, not negative
        w_emit 0.1            -> group-centered; when all 8 rollouts emit it is a group
                                 constant => advantage 0
        meta_floor 0.0        -> OFF; this was the only unconditional pull
        len_cost 0.08         -> against, unconditional, every token
        trunc_open 0.3        -> against
        R_corr 1.0            -> against: a truncated response scores -1, and the meta block
                                 pushes b3p toward the 8192 cap
      Measured collapse on the live arm (pure-stag / rq3v2f_b3p):
        dcpo/meta_emit_rate  1.00 (gs<=100) -> 0.897 (gs150) -> 0.197 (gs200) -> 0.041 (gs290)
                             -> 0.0137 (gs298)
                             [log:2242 for the 1.00 -> 0.0137 endpoint; log:2256 §3 table for
                              the gs100/150/200/290 trajectory]
        clip_ratio b3p vs its matched twin b2p: 3.0x / 3.0x / 1.7x / 2.8x at gs100/150/200/290
                             — the meta block amplifies a drift both arms have; it is an
                             amplifier, not the sole cause (E-170 §3 caveat).
      Consequence for the science, not just the metric: from gs150 the treatment is
      absent, so that interval is not a test of the mechanism. Pre-registration A1
      (docs/PREREGISTRATION_rq3v2_base_replication.md:58, meta_emit_rate >= 0.80 sustained)
      broke at gs135; A2 (:59, attempted >= 0.30) broke at gs190. The run is
      pre-registration Outcome C (invalid run), not Outcome B (substrate-specific)
      — E-170 §4 explicitly corrects the earlier reading. Reporting "no effect on the base
      substrate" from this run would be attributing to the substrate a self-destruction
      caused by a disabled guard.
      Scope note (E-171 §1-2): T1 (the instruct win) ran the SAME config with the SAME
      meta_floor=0.0 and w_emit=0.1. The guard was off in both runs. T1 survived because on
      the instruct substrate the block REDUCED truncation (MATH500 ~6% vs 19%; AIME ~50% vs
      73%), so the weight-1.0 correctness head did the floor's job by accident. The T1 win
      therefore rests on an uncontrolled coupling (block <-> truncation) whose sign happened
      to be favourable, not on a reproducible design.
    guard_metric:
      name: dcpo/meta_emit_rate
      healthy: ">= 0.80 sustained, flat, not eroding by gs80"
      healthy_source: "docs/CONSTITUTION.md:185 (Part VI gate) and
        docs/PREREGISTRATION_rq3v2_base_replication.md:58 / :125"
      dashboard_band: "0.98-0.99 healthy vs 0.40-0.52 broken — docs/CONSTITUTION.md:118"
      broken_observed: "0.0137 at gs298 on rq3v2f_b3p (log:2242)"
      leading_indicator: "clip_ratio. Emission held at 1.00 while clip_ratio ~ 0; erosion
        began at gs110-120 as clip crossed 1% and resp_len went 462 -> 746; collapse at gs200
        as clip crossed 4% (E-170 §3). Watch clip_ratio to see this coming ~90 steps early."
    open_question_do_not_treat_as_fixed: |
      Turning the floor back to 0.05 is NOT established as the fix. The floor is an
      unconditional pull, so it holds up useless emission too — which is exactly why it was
      lowered (boilerplate suppression). E-170 §5 leaves this unmeasured, and this project
      has met the selectivity-vs-always-on tradeoff before. E-171 §5's prescription is not
      "turn the floor on" but "freeze and record the resolved config per run, and diff
      matched pairs at the resolved layer." This registry is step one of that.

  dcpo_rmeta_source:
    kind: knob
    status: live
    reached_by: [b3p]
    set_at: |
      h100std_rq3v2f_b3p.yaml:251  ++algorithm.dcpo_rmeta_source=pmi_shift   (WINS)
      configs/triobj_dcpo_v4_stage3b_h100_4x4k.yaml:175  dcpo_rmeta_source: cf_group  (overridden)
    code_default: "NONE — deliberately. src/training/verl_sdc.py:206 reads it with a sentinel
      (_V4_RMETA_MISSING) and _v4_rmeta_source_strict raises on absent/unreadable/invalid
      (verl_sdc.py:204-217). The comment at :195-198 records why: the old
      read(\"dcpo_rmeta_source\", \"cf\") fell open onto the deprecated CF path silently
      whenever the knob was missing OR the config was unreadable."
    default: null
    legal_values: "cf, pmi, none, cf_group, decoy_did_gm, decoy_did_rlsd, asym_cf, pmi_shift
      (src/training/verl_sdc.py:199-200)"
    why_load_bearing: |
      This one knob selects which of eight mutually exclusive meta-reward generations runs,
      and therefore which of the other 54 knobs are read at all. It is the reason a config
      diff is not a specification of a run: configs/triobj_dcpo_v4_stage3b_h100_4x4k.yaml
      sets 12 knobs for cf_group and pmi that the live arm never reads, and sets ZERO of the
      7 knobs the live arm's actual scorer reads (see dcpo_pmishift_* below).
    disabling_failure: |
      Cannot be disabled — it fails loudly by design, and that design is the fix for a real
      past defect (verl_sdc.py:195-198, "review round 2 M-A"). This is the correct pattern
      and the contrast that makes dcpo_meta_floor's silent 0.0 indefensible: the same file
      proves the authors know how to make a missing knob crash.
      What CAN still go wrong is silent MISDIRECTION: setting it to a valid value whose
      supporting knobs are unset, which is the live state today.
    guard_metric:
      name: "the per-source engagement pair — dcpo/pmishift_attempted_rate and dcpo/pmishift_n_save"
      healthy: ">= 0.30 and > 0 respectively (docs/CONSTITUTION.md:186)"
      broken_observed: "attempted 0.711 (warmup) -> 0.634 (mid) -> 0.151 (late) on rq3v2f_b3p
        (log:2414 table). Crosses the 0.30 gate downward at ~gs190."
      note: "A source selected but starved reads identical to a source not selected. There is
        no metric that says WHICH source is running — that comes only from the resolved config."

  trainer.val_before_train:
    kind: knob
    status: live
    reached_by: [b0p, b2p, b3p]
    not_a_dcpo_knob: true
    note: "Included because it is load-bearing on the same headline numbers the dcpo_* knobs
      feed, and because it exhibits the identical config-vs-launcher inversion."
    set_at: |
      configs/base_matched_grpo_h100_4x4k.yaml:84         val_before_train: true
      configs/triobj_dcpo_v4_stage3b_h100_4x4k.yaml:249   val_before_train: true
      configs/verl_sdc_e21r_shared.yaml:298 (2 levels up)  val_before_train: false
      h100std_rq3v2f_b0p.yaml:289  ++trainer.val_before_train=False   (WINS)
      h100std_rq3v2f_b2p.yaml:283  ++trainer.val_before_train=False   (WINS)
      h100std_rq3v2f_b3p.yaml:269  ++trainer.val_before_train=False   (WINS)
    default: "false (inherited from verl_sdc_e21r_shared.yaml:298)"
    effective_value: "False on all three arms"
    the_inversion: |
      BOTH live leaf configs deliberately set true — they override the inherited false to
      get the step-0 pass — and ALL THREE launchers override it back to False. The
      operator-facing file (the launcher) silently reverses the decision recorded in the
      science-facing file (the config). Nothing logs the reversal.
    disabling_failure: |
      With val_before_train=False and trainer.test_freq=50 (h100std_rq3v2f_b0p.yaml:288,
      b2p:282, b3p:268), the first validation row on every arm is gs50. NO ARM HAS A gs0 ROW.
      That is not a cosmetic gap, because the arms do not start from the same model:
        b0p init = models/b0p2_rvfull_eb16_sft  (meta-REMOVED twin; h100std_rq3v2f_b0p.yaml:118)
        b2p init = models/b2p2_rvfull_eb16_sft  (h100std_rq3v2f_b2p.yaml:118)
        b3p init = models/b2p2_rvfull_eb16_sft  (same as b2p; h100std_rq3v2f_b3p.yaml:100)
      So the pre-registered replication axis A3 (b3p - b0p >= +10pp,
      docs/PREREGISTRATION_rq3v2_base_replication.md:60) and RQ1 (b2p - b0p) both cross an
      SFT-init boundary. Without a gs0 row the SFT-stage head start and the RL-stage effect
      are summed into a single number and cannot be separated. The earliest evidence we have
      is gs50, where the axis already reads +0.0246 (log:2233 table) — and we cannot say how
      much of that was already there before the first gradient step.
      Only RQ2 (b3p - b2p) is unaffected, because b2p and b3p share an init by construction.
      Cost of the fix: one validation pass (594 problems, greedy — docs/CONSTITUTION.md:145)
      per arm, once. That is a rounding error against a ~30h/arm run.
    guard_metric:
      name: "presence of a global_step=0 row in val/* for every arm"
      healthy: "one gs0 row per arm, logged before the first optimizer step"
      broken_observed: "zero gs0 rows across b0p / b2p / b3p; the 9-bench table in the run log
        (log:2233-2241) starts at gs50 for all arms"
      why_this_metric: "It is a presence check, not a threshold — it can be evaluated before
        launch from the resolved config, which is the whole point."

# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 2 — REQUIRED GATE ADDITION
# Not a knob. A dashboard metric whose healthy band the constitution already records and
# whose launch gate the constitution does not check.
# ═══════════════════════════════════════════════════════════════════════════════

required_gate_additions:

  - metric: dcpo/pmishift_rmeta_mean_scored
    kind: guard_metric
    status: REQUIRED GATE ADDITION
    band_declared_at: "docs/CONSTITUTION.md:128"
    healthy: "+1.0 .. +1.2"
    broken: "~ -0.2  (constitution's own 'Broken (base B3)' column)"
    reads: "mean scored meta reward. Near-0 => no signal."
    measured_on_live_arm:
      value: -0.141
      window: "warmup, gs <= 80"
      source: "docs/reports/2026-07-17-rq3-run-and-iteration-log.md:2414"
      corroborating: "rmeta_neg_rate 0.261 > rmeta_pos_rate 0.207 in the same window (log:2414).
        During the first 80 steps — exactly when the convention has to set — the average
        scored meta reward was NEGATIVE."
      also_seen: "+0.136 (mid, gs81-150), -0.022 (late, gs>150) — same table. The sign is not
        stable, and the warmup window is the one that matters."
    the_defect: |
      -0.141 sits in the constitution's own BROKEN column. Every declared launch gate passed
      anyway, because Part VI (docs/CONSTITUTION.md:182-190) lists only four conditions and
      this metric is not among them:
        dcpo/meta_emit_rate >= 0.8              PASS  (:185)
        dcpo/pmishift_attempted_rate >= 0.3
          and dcpo/pmishift_n_save > 0          PASS  (:186)
        actor/entropy > 0.1 and clip < 0.2      PASS  (:187)
        matched arms differ only on their axis   PASS  (:188)
      Part IV knew the number's healthy range. Part VI never looked at it.
      Independently confirmed by the G2 firing check (E-172, log:2404): the head is WIRED and
      DOES fire — gdpo/meta_region_utility/std = 1.038 in warmup — so this is not an inert
      lever. It is a lever pulling the wrong way, which no existing gate can express.
      The four current gates all ask "is the reward FIRING?". None asks "is the reward
      pointing the RIGHT WAY?". That is the category the addition closes.
    proposed_gate_text: |
      Add to docs/CONSTITUTION.md Part VI, after the pmishift_attempted line:
        - `dcpo/pmishift_rmeta_mean_scored` > 0 over the warmup window, and >= +0.5 by gs80
          (else the meta reward is firing with the wrong sign — the convention cannot set
          against a negative mean). Cross-check `dcpo/rmeta_pos_rate > dcpo/rmeta_neg_rate`.
      Rationale, in the words of stacked-research §7 as quoted at log:2432:
        "게이트를 통과했는데 실패가 났으면 게이트를 추가한다."
        (if it passed the gate and still failed, add a gate.)
    also_add_the_direction_check: |
      Same class, same run: dcpo/meta_emit_rate PASSED the >=0.8 gate at gs25 and then decayed
      monotonically to 0.0137. Part VI's wording already says "sustained, not eroding below
      0.80 by gs80" in the PRE-REGISTRATION (:58) but the CONSTITUTION's Part VI (:185) states
      it as a bare threshold with no trajectory clause. Align them: a gate evaluated once at
      gs25 cannot catch a slow guard failure.
    blocker_for_automation: |
      There is no script to add this check to. Part VI is prose only — verified by
      `grep -rln "meta_emit_rate|pmishift_attempted_rate" scripts/ experiments/` returning
      nothing. Phase 3 should give the constitution an executable twin; until then the gate
      addition is a documentation change that a human must run.

# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 3 — DEFAULT-ONLY ON THE LIVE PATH
# Reached by pure-stag (b3p) every step. Set by nothing. The code default IS the recipe.
# ═══════════════════════════════════════════════════════════════════════════════

default_only:

  _summary: |
    ★ These seven knobs parameterise _compute_dcpo_v4_pmi_shift_rmeta — the scorer that
    produces b3p's ENTIRE meta reward. Not one of them appears in
    configs/triobj_dcpo_v4_stage3b_h100_4x4k.yaml, in any launcher, or in any ancestor
    config. Verified: `grep -n dcpo_pmishift configs/*.yaml h100std_rq3v2f_*.yaml` -> no hits.
    Meanwhile the same config spends 8 lines setting dcpo_pmi_* knobs the run never reads.
    The recipe the paper will describe is stored in argument defaults at
    src/training/verl_sdc.py:2378-2388, six weeks of git history away from the config a
    reader would open. This is the E-171 lesson repeating one layer deeper: not merely
    inherited, but never written down at all.
    Phase-2 action: PROMOTE all seven into the live config at their current values in a
    single no-op-by-value commit, so the recipe becomes diffable. Do not change any value in
    that commit — b3p resubmits from the working tree and a value change would fork the run.

  dcpo_pmishift_scale:
    kind: knob
    status: default-only
    reached_by: [b3p]
    set_at: "code default at src/training/verl_sdc.py:2378"
    default: 1.0
    role: "global multiplier on the shift head"

  dcpo_pmishift_reversal_save:
    kind: knob
    status: default-only
    reached_by: [b3p]
    set_at: "code default at src/training/verl_sdc.py:2379"
    default: 1.0
    role: "bonus magnitude for a decoy->gold reversal (the reward's core positive event)"

  dcpo_pmishift_reversal_derail:
    kind: knob
    status: default-only
    reached_by: [b3p]
    set_at: "code default at src/training/verl_sdc.py:2380"
    default: 2.0
    role: "penalty magnitude for a gold->decoy reversal"
    note: "The save/derail asymmetry (1.0 vs 2.0) is a live scientific choice sitting in an
      argument default. E-168 initially proposed it as the cause of the emission collapse;
      the run log corrects that (log:2250) — SAVE/DERAIL events touch only ~3% of attempted
      blocks (5-6 events against 512 rollouts/step = train_batch 64 x rollout.n 8), too few to
      drive collapse. It is still an unrecorded parameter of the headline recipe."

  dcpo_pmishift_clip:
    kind: knob
    status: default-only
    reached_by: [b3p]
    set_at: "code default at src/training/verl_sdc.py:2381"
    default: 2.0

  dcpo_pmishift_decoy_seed:
    kind: knob
    status: default-only
    reached_by: [b3p]
    set_at: "code default at src/training/verl_sdc.py:2382"
    default: 42
    note: "Reproducibility-critical and unrecorded. A decoy-selection seed belongs in the
      frozen run manifest (scripts/freeze_run_manifest.py), not in a default."

  dcpo_pmishift_reversal_min_magnitude:
    kind: knob
    status: default-only
    reached_by: [b3p]
    set_at: "code default at src/training/verl_sdc.py:2383"
    default: 0.0
    note: "0.0 = no minimum; every sign flip counts however small. Same
      disabled-equals-unset hazard as dcpo_meta_floor."

  dcpo_pmishift_meta_body_dup_thresh:
    kind: knob
    status: default-only
    reached_by: [b3p]
    set_at: "code default at src/training/verl_sdc.py:2388"
    default: 1.0
    role: "token-Jaccard threshold; a meta block that near-duplicates the body earns no shift
      credit (presence-as-confidence confound guard)"
    note: "★ SECOND DISABLED GUARD, SAME SIGNATURE AS dcpo_meta_floor. The code comment at
      verl_sdc.py:2384-2387 states 'dup_thresh>=1.0 disables'. The default is exactly 1.0.
      So the confound guard against 'meta that just restates the body' has never been on, on
      any run, and nothing in any config or dashboard says so. Unlike meta_floor there is no
      measurement of what it costs — that is a gap, not a clearance."

# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 4 — LIVE (reached by b3p, explicitly set)
# Not load-bearing in the strict sense (no measured disabling failure on record), but on
