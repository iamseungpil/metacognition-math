# SECTION 5 — DEAD LINEAGE, GROUPED BY RETIRED GENERATION
#
# Phase-2 disposition vocabulary:
#   archive_with_branch — not set anywhere, not reachable without editing a launcher.
#                         Removable ONLY as one archive commit that takes the knob, its
#                         dcpo_rmeta_source branch, and its entry in _V4_RMETA_SOURCES
#                         (src/training/verl_sdc.py:199-200) together. Deleting the knob
#                         alone leaves the branch selectable and reading silent defaults —
#                         the exact defect verl_sdc.py:195-198 was written to prevent.
#                         Per stacked-research §5.6 these are ARCHIVED, not deleted, and the
#                         archive dir gets a README saying why each is there.
#   adjudicate          — set in a config a live arm loads, or read on a live path. Cannot be
#                         removed without a per-knob decision. b3p resubmits from the working
#                         tree: any edit to configs/ or src/ is a live-run hazard, so NONE of
#                         these may be touched while pure-stag is running.
# ═══════════════════════════════════════════════════════════════════════════════

