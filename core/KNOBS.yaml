tally:
  # TWO different totals, and conflating them is how a tally goes stale. The SURFACE is what
  # the code can still read. The REGISTERED count includes section 5B, which exists precisely
  # so that names with no code left behind them stay inside the gate's coverage.
  current_surface: 50
  registered_names: 85    # 50 surface + 35 removed
  recomputed: "2026-08-03, after adding section 5B. Surface was 85 before the 0803 removals."
  by_status:
    live: 37          # 2 in load_bearing + 35 in live; of these 21 are knobs, 16 are channels
    default-only: 7   # every dcpo_pmishift_* — the live scorer's whole parameterisation
    dead-lineage: 6   # 4 cf_counterfactual + 2 v2_canary_sandbag
    removed: 35       # section 5B: 9 asym_cf + 8 pmi_dense + 2 cf_group + 8 decoy_did + 8 answer_route
  by_kind:
    knob: 60          # 21 live + 7 default-only + 3 dead-lineage + 29 removed
    channel: 25       # 16 live + 3 dead-lineage + 6 removed
  cross_check: "SURFACE: 37 + 7 + 6 = 50. REGISTERED: 50 + 35 = 85; 60 + 25 = 85 — which is the
    same 85 the original enumeration found, because section 5B gives every retired name a home
    instead of dropping it. Recompute before editing this block: parse this file, collect every
    key carrying a `status`, and diff against
    `grep -rhoE '\"dcpo_[a-z_0-9]+\"' src/training/*.py | sort -u`. The diff runs BOTH ways and
    both sides are fully accounted for (measured 2026-08-03, 86 registered entries vs 49 code
    names, 48 in common):
      registry-only, 38 = 35 (section 5B, registered with no code reader BY CONSTRUCTION —
        that is what the section is for)
        + 2 (dcpo_w_over, dcpo_over_threshold — no reader either, but they stay in
             dead_lineage; see dead_lineage.cf_counterfactual.why_these_four_survived_the_0803_removal)
        + 1 (trainer.val_before_train — load-bearing, deliberately registered, not a dcpo_*
             name, hence excluded from the counts above; see excluded_from_counts)
      code-only, 1 = dcpo_ack_load_bearing, which is the acknowledgement list itself, not a knob.
    Note the entry count is 86 while dcpo_* registered_names is 85: the extra one is
    trainer.val_before_train. Earlier revisions of this block called the registry-only diff
    'THREE names wide' and then listed dcpo_ack_load_bearing as one of the three, which mixed
    the two directions together. Keep them separate."
  removed_2026_08_03:
    count: 35
    per_knob_shas: "section 5B — `removed:`. Each name carries the commit that took its last
      reader, verified by git grep across all seven commits, not by reading commit subjects."
    generations: "asym_cf 9 (a6c05a5) + pmi_dense 8 (8ddae40) + cf_group 2 (b70316e) +
      decoy_did 8 (bfbf89c) + answer_route 8 (4eefaf6)"
