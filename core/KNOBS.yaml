# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 5 — DEAD LINEAGE, GROUPED BY RETIRED GENERATION
#
# Phase-2 disposition vocabulary:
#   archive_with_branch — not set anywhere, not reachable without editing a launcher.
#                         Removable ONLY as one archive commit that takes the knob, its
#                         dcpo_rmeta_source branch, and its entry in _V4_RMETA_SOURCES
#                         (src/training/verl_sdc.py:199-200) together. Deleting the knob
#                         alone leaves the branch selectable and reading silent defaults —
#                         the exact defect verl_sdc.py:195-198 was written to prevent.
#                         Per stacked-research §5.6 these are ARCHIVED, not deleted, and the
#                         archive dir gets a README saying why each is there.
#   adjudicate          — set in a config a live arm loads, or read on a live path. Cannot be
#                         removed without a per-knob decision. b3p resubmits from the working
#                         tree: any edit to configs/ or src/ is a live-run hazard, so NONE of
#                         these may be touched while pure-stag is running.
# ═══════════════════════════════════════════════════════════════════════════════

dead_lineage:

  cf_counterfactual:
    generation: "cf / cf_group — counterfactual regeneration + group-branch + AdaCoT over-penalty (2026-06-21/22)"
    retired_because: |
      Three separate reasons stack: (a) sdc_counterfactual: false in the live config disables
      the regeneration machinery (spec §4: gated off, not deleted); (b) the whole
      agent_loop_config_path block was removed on 0711, and the live launchers actively ABORT
      if it reappears (h100std_rq3v2f_b0p.yaml:178, b2p:173, b3p:154); (c) b3p overrides
      rmeta_source to pmi_shift.
    count: 4
    phase2: adjudicate
    why_these_four_survived_the_0803_removal: |
      Every knob removed on 0803 is in section 5B with the sha that took it. These four are
      the ones that did NOT go, and they survived for four different reasons — the list is
      here so that "still in dead_lineage" is never read as "nobody looked at it".

        dcpo_cf_suppress_signature — WRONG LINEAGE. sdc_counterfactual / v3-regeneration
          machinery, not cf_group. Never mapped in the 0803 pass, so nothing established it
          was unreachable. A name-prefix delete of cf_* would have swept it up; that is the
          failure this line is here to prevent.
        dcpo_cf_with_meta — reachable-but-inert. Its writer went with the cf_group
          generate_sequences wrap, but it is STILL READ on the live rollout-table `arm`
          column, where it is now permanently None. Proved harmless, not proved unreachable,
          and the discipline rule licenses removing only the latter.
        dcpo_w_over — zero readers in src/ as of bfbf89c, so by the removed-section's own
          test it qualifies. It stays in dead_lineage anyway because
          h100std_rq3v2f_b3p.yaml:252 STILL SETS IT and amlt reads that launcher from the
          working tree (unlike src/ and configs/, which come from pinned tar 490407111).
          Moving it to `removed` would make the gate reject the live b3p launcher — arguably
          the right answer, since the override is a silent no-op, but that blocks a
          resubmission and is a live-affecting decision that needs its own approval. Keeping
          it registered as dead-lineage is the conservative position: still inside the gate's
          coverage, not yet blocking. ★ RESOLVE THIS with the Stage-6 launcher-line removal;
          the two belong in one decision.
        dcpo_over_threshold — also lost its last reader at bfbf89c, but no removal commit
          ever claimed the name and nothing anywhere sets it. Reclassifying it as `removed`
          would assert a retirement no commit performed, so it stays. Consequence to know:
          a config setting it to 1.0 still passes the gate.

      The honest summary is that the dead/removed boundary is not drawn on "has a reader" —
      w_over and over_threshold have none. It is drawn on what a removal commit actually did.
    why_adjudicate: |
      Two of the original six (dcpo_cf_branch_frac, dcpo_cf_without_mode) were removed from the
      tree on 2026-08-03 with the cf_group branch. The four below stay, for three different
      reasons — none of them "still live".
      ★ h100std_rq3v2f_b3p.yaml:252 STILL spends a line on ++algorithm.dcpo_w_over=0.0, and as
      of the 0803 cleanup that knob has ZERO readers anywhere in src/ (both reads, the gm tail
      and the cf_group head, are gone). The override is now not merely decorative but
      addresses nothing. It is kept REGISTERED on purpose: validate() only checks knobs the
      registry knows, so deleting this entry while the launcher still sets the knob would drop
      it out of the gate's coverage — the exact invisibility this file exists to prevent.
      Removing the launcher line is a live-affecting edit and needs its own approval.
      The override is also load-bearing on our BELIEF:
      the b3p description (h100std_rq3v2f_b3p.yaml:1) cites "w_over=0" as evidence that the
      reward setup is identical to the T1-winning launcher, and the matched-arm audit
      (docs/CONSTITUTION.md:196-197) enumerates launcher overrides to prove arms differ only on
      their declared axis. An override that changes nothing makes that audit read as thorough
      while telling you nothing. Same disease as E-171, opposite symptom: there we missed a
      knob that mattered; here we counted one that does not.
    knobs:
      dcpo_cf_suppress_signature:
        {kind: knob, status: dead-lineage, set_at: "configs/triobj_dcpo_v4_stage3b_h100_4x4k.yaml (true) — SET, NOT READ",
         code_default: "True at src/training/verl_sdc.py (_dcpo_cf_call_engine)", default: true,
         note: "WRONG-LINEAGE guard: this is sdc_counterfactual / v3-regeneration machinery, NOT
                cf_group. It survived the 0803 cleanup deliberately. A name-prefix delete of
                cf_* would sweep it up."}
      dcpo_cf_with_meta:
        {kind: channel, status: dead-lineage, set_at: "WRITER REMOVED 2026-08-03 with the cf_group
                generate_sequences wrap; still READ on the live rollout-table `arm` column",
         note: "now permanently None on every step. Reachable-but-inert, so it was left in place
                rather than removed — the discipline rule only licenses removing what is proved
                unreachable."}
      dcpo_w_over:
        {kind: knob, status: dead-lineage, set_at: "h100std_rq3v2f_b3p.yaml:252 (0.0) and
                experiments/configs/science/rl_pmishift.yaml:55; the config default was removed 0803",
         code_default: "0.0", default: 0.0,
         note: "ZERO readers in src/ as of 0803. Kept registered so the launcher line stays inside
                the gate's coverage until the line itself is removed."}
      dcpo_over_threshold:
        {kind: knob, status: dead-lineage, set_at: "no setter and, as of bfbf89c, no reader", default: 1.0,
         note: "Survived the 0803 removal because no removal commit claimed the name — see
                why_these_four_survived_the_0803_removal. Also the exemplar the registry's own
                tests use for the dead-lineage deviation rule (tests/test_knob_registry.py)."}

  v2_canary_sandbag:
    generation: "TRIOBJ_DCPO_V2 canary / sandbag diagnostics"
    retired_because: "the v2 producers are gone. src/training/dcpo_region.py:1049-1050 returns
      constant [1.0]*B stubs, and the docstring at :812 says so: 'plus constant
      canary_pass1_acc / sandbag_clamp stubs (kept so the existing ... contract holds)'."
    count: 2
    phase2: adjudicate
    survived_the_0803_removal_because: "both are EXECUTING on the live b3p hot path every step
      (verl_sdc.py:876-879), which makes them reachable-but-inert rather than unreachable. The
      0803 pass removed only what it proved unreachable, so neither was touched and neither is
      in section 5B."
    why_adjudicate: |
      These two are the odd case: dead lineage riding a LIVE code path. They are written
      unconditionally into every b3p batch (verl_sdc.py:876-879), always 1.0, always have
      been. They are not reachable-if-selected like the branch knobs — they are executing
      right now and carrying no information. Removing them touches a hot path
      (verl_sdc.py, dcpo_region.py) that b3p resubmits from, and the module-level template at
      verl_sdc.py:155 pre-seeds both keys to None, so a partial removal changes what
      `.get(name, [1.0]*bs)` returns. Adjudicate individually, after pure-stag lands.
    knobs:
      dcpo_canary_pass1_acc:
        {kind: channel, status: dead-lineage, set_at: "written src/training/verl_sdc.py:876 (also :3017, :3196) from the constant stub at dcpo_region.py:1049",
         default: 1.0, note: "no consumer found outside the write sites"}
      dcpo_sandbag_clamp:
        {kind: channel, status: dead-lineage, set_at: "written src/training/verl_sdc.py:878 (also :3019, :3198) from the constant stub at dcpo_region.py:1050",
         default: 1.0, note: "no consumer found outside the write sites"}

# ═══════════════════════════════════════════════════════════════════════════════
# SECTION 5B — REMOVED
#
# The knobs whose READER no longer exists. Section 5 (dead_lineage) and this section
# describe two different hazards and the guard treats them differently:
#
#   dead_lineage — the code is still there. Setting the knob to a non-default value
#                  REACHES a retired generation. Presence at the registered default is
#                  tolerated, because presence alone is not activation.
#   removed      — the code is gone. Setting the knob reaches nothing at all. Presence
#                  is rejected UNCONDITIONALLY, at any value including the old default,
#                  because a config that still sets one is a silent no-op: the operator
#                  believes a lever is set and no run, log or dashboard will contradict
#                  them. That is the E-171 failure shape with the sign flipped — there we
#                  missed a knob that mattered, here we would count one that cannot.
#
# There is no "removed at its default is fine" case. The default is gone too.
#
# METHOD (each sha below was verified, not taken from the removal report's prose)
#   For every name, `git grep -c -w <name> <sha> -- src` was evaluated across all seven
#   0803 commits. `removed_in` is the commit at which that count first reached 0 and
#   stayed 0 through HEAD. `kind` and `former_default` were read back from the
#   pre-removal registry (git show 8b51f85:core/KNOBS.yaml), not reconstructed.
