tally:
  total_names: 85
  by_status:
    live: 37          # 2 in load_bearing + 35 in live; of these 21 are knobs, 16 are channels
    default-only: 7   # every dcpo_pmishift_* — the live scorer's whole parameterisation
    dead-lineage: 41  # 9 asym_cf + 6 gm + 3 rlsd + 7 answer-route + 6 cf + 8 pmi + 2 v2
  by_kind:
    knob: 60          # 21 live + 7 default-only + 32 dead-lineage
    channel: 25       # 16 live + 9 dead-lineage
  cross_check: "37 + 7 + 41 = 85 = the grep count. 60 + 25 = 85. Recompute both before editing
    this block: parse this file, collect every dcpo_* key carrying a `status`, and diff against
    `grep -rhoE '\"dcpo_[a-z_0-9]+\"' src/training/*.py | sort -u`."
