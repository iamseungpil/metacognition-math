  arms_reading_zero_dcpo_knobs: [b0p, b2p]

phase2_disposition:
  safe_to_remove_now: []
  rationale: |
    NOTHING is safe to remove while solid-gibbon, hip-hound and pure-stag can resubmit. A
    preempted arm resubmits from the working tree, so src/ and configs/ must stay
    byte-identical. Every dead-lineage knob above is either (a) inside src/training/*.py,
    (b) inside a config a live arm loads, or (c) both. The empty list is the finding, not an
    omission.
  when_pure_stag_lands:
    archive_with_branch:
      total_names: 18
      constraint: "one archive commit per generation; knob + branch + source-enum entry move
        together, or _v4_rmeta_source_strict starts accepting a value whose knobs are gone"
      generations:
        - "asym_cf: 9 knobs + branch verl_sdc.py:676-828 + the 'asym_cf' entry in _V4_RMETA_SOURCES"
        - "decoy_did_gm: 6 knobs + scorer verl_sdc.py:2159-2166 + its _V4_RMETA_SOURCES entry"
        - "decoy_did_rlsd: 3 names + its _V4_RMETA_SOURCES entry"
    adjudicate_individually:
      total_names: 23
      generations:
        - "cf_group_answer_route: 7 (dcpo_w_score_alpha is set in a live config)"
        - "cf_counterfactual: 6 (dcpo_w_over is set by a live LAUNCHER and cited as audit evidence)"
        - "pmi_dense: 8 (all set in a live config, with the probe provenance worth preserving)"
        - "v2_canary_sandbag: 2 (dead lineage on a live hot path)"
  promote_not_remove:
    - "the 7 dcpo_pmishift_* knobs: write them into
       configs/triobj_dcpo_v4_stage3b_h100_4x4k.yaml at their current default values so the
       live recipe becomes diffable. Values unchanged — this must be a no-op by value."
  fix_the_class_not_the_instance:
    - "Audit every guard whose disabled value equals its code default. Two are already known:
       dcpo_meta_floor (0.0 = off, verl_sdc_utils.py:481) and dcpo_pmishift_meta_body_dup_thresh
       (1.0 = disabled, verl_sdc.py:2388). In that state 'nobody set it' and 'someone turned it
       off' are the same observable. Either give guards a sentinel default that raises — the
       pattern dcpo_rmeta_source already uses at verl_sdc.py:206 — or log the resolved value of
       every guard at step 0."
    - "Freeze and record the RESOLVED config per run, and diff matched pairs at the resolved
       layer, not the launcher layer (E-171 §5). scripts/freeze_run_manifest.py is the
       existing hook."

