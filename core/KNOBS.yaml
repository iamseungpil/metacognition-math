phase2_disposition:
  status: "EXECUTED 2026-08-03. This block previously said nothing was safe to remove; that
    premise was wrong, and the correction is the finding."
  why_the_old_premise_was_wrong: |
    The old rationale read: "NOTHING is safe to remove while solid-gibbon, hip-hound and
    pure-stag can resubmit. A preempted arm resubmits from the working tree, so src/ and
    configs/ must stay byte-identical."

    The second sentence is false for src/ and configs/. All three launchers pin
    CODE_TAR_REVISION "490407111" (b0p:33, b2p:33, b3p:33) and curl that GitHub release asset
    at job start, so a resubmission gets the PINNED tar, never the working tree. What amlt
    does read from the working tree is the LAUNCHER YAML itself — which is exactly why the
    dcpo_w_over launcher line was NOT removed in this pass while the code was.

    Cost of the error: the removal it blocked was ~5,800 lines and 35 of 85 knob names.
    Generalisation: "a live job could resubmit from here" is a claim about a specific FILE
    SET, not about the repo. Name the files before you freeze them all.
  removed:
    - "asym_cf: 9 knobs + branch + its _V4_RMETA_SOURCES entry"
    - "pmi_dense: 8 knobs + scorer + dcpo_pmi.py splice/gate/guard core + the offline probe"
    - "cf_group: 4 knobs (2 here, 2 in cf_group_answer_route) + branch + rollout agents"
    - "decoy_did_gm + decoy_did_rlsd: 9 names + branch + scorer + dcpo_directional gm/rlsd core"
    - "cf_group_answer_route: 7 names + the compose answer-route and rlsd multiply"
  not_removed_and_why:
    - "dcpo_w_over / experiments+launcher lines: removing them edits a LIVE-AFFECTING launcher
       (amlt reads it from the working tree, unlike src/ and configs/). Needs its own approval.
       The knob now has zero code readers; the line is inert but uncovered-if-unregistered."
    - "dcpo_cf_suppress_signature + cf_prefix_agent + the 'cf' source: WRONG LINEAGE. This is
       sdc_counterfactual / v3-regeneration machinery, never mapped in this pass."
    - "dcpo_cf_with_meta, dcpo_canary_pass1_acc, dcpo_sandbag_clamp: reachable-but-inert on a
       live hot path. Proved harmless, NOT proved unreachable — the rule licenses only the latter."
    - "the 7 dcpo_pmishift_* knobs: PROMOTE, not remove (see promote_not_remove below)."
  known_open_gate: |
    The working tree still cannot launch b3p, and this predates the cleanup. validate() against
    the resolved b3p config raises because dcpo_ack_load_bearing names none of
    [dcpo_meta_floor, dcpo_rmeta_source, trainer.val_before_train]. Before the cleanup there
    were SIX problems; five were config keys that deviated from their registered defaults and
    were cleared as a side effect of removing them with their readers. This last one needs a
    launcher ADDITION, which is not a removal.
    Re-measured after section 5B and the unconditional removed-knob rule were added: STILL
    exactly one problem, unchanged. The resolved b3p config sets 23 dcpo_* keys and none of
    them is a removed name, so the tightening costs the live arm nothing. The same check
    against configs/archive/triobj_dcpo_v4_stage3_h100_4x4k.yaml raises EIGHT problems, seven
    of them removed dcpo_pmi_* keys — that config is loaded by no launcher, and the seven are
    the guard's first real catch.
  promote_not_remove:
    - "the 7 dcpo_pmishift_* knobs: write them into
       configs/triobj_dcpo_v4_stage3b_h100_4x4k.yaml at their current default values so the
       live recipe becomes diffable. Values unchanged — this must be a no-op by value. Still
       outstanding: it is an ADDITION, out of scope for a removal pass."
  fix_the_class_not_the_instance:
    - "Audit every guard whose disabled value equals its code default. Two are already known:
       dcpo_meta_floor (0.0 = off, verl_sdc_utils.py:481) and dcpo_pmishift_meta_body_dup_thresh
       (1.0 = disabled, verl_sdc.py:2388). In that state 'nobody set it' and 'someone turned it
       off' are the same observable. Either give guards a sentinel default that raises — the
       pattern dcpo_rmeta_source already uses at verl_sdc.py:206 — or log the resolved value of
       every guard at step 0."
    - "Freeze and record the RESOLVED config per run, and diff matched pairs at the resolved
       layer, not the launcher layer (E-171 §5). scripts/freeze_run_manifest.py is the
       existing hook."

