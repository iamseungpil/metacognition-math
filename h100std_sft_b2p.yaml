description: "B2-prime v8-META SFT1 (think-on matched ladder TREATMENT init for B2p/B3p, E-071 Option C). Init = TRUE pretrained Qwen/Qwen3-8B-Base. Trains on data/b2on_v8meta_strict_sft.parquet (v8_meta_inside_strict base-render: 4245 rows, 100 pct think-closed / meta proper-nested / meta-INSIDE-think, <=4096 tok, EOS im_end, L0 GREEN E-070). This is the T1 winner SFT1 foundation the failed b23 generation SKIPPED. Whole-response training (no wrong_prefix; matches T1 SFT1). 3 epochs, max_length 4096, lr 1e-5 (base adaptation, ledger-flagged vs T1 2e-6). After SFT: (a) verify_eos_invariant.py MUST be GREEN, (b) L2 gate: eval_vllm_1030 on math500-100 + aime2024 at 8k temp 1.0 n2 measuring truncation pct (<=5 pct kill-switch) + meta emission (>=0.85 target) + wellformed. Pushes checkpoints/b2p_v8meta_strict_sft to iamseungpil/metacot under models/b2p_v8meta_strict_sft/. H100x4 Standard."

target:
  service: sing
  name: msrresrchbasicvc
  workspace_name: msra-sh-aml-ws

environment:
  registry: mcr.microsoft.com
  image: aifx/acpt/stable-ubuntu2204-cu126-py310-torch28x:latest

code:
  local_dir: $CONFIG_DIR/

jobs:
  - name: sft_b2p_v8meta
    sku: 80G4-H100
    sla_tier: Standard
    priority: high
    identity: managed
    submit_args:
      max_run_duration_seconds: 604800
      env:
        _AZUREML_SINGULARITY_JOB_UAI: "/subscriptions/c4c534bc-9978-4974-9c87-551f7c5754ef/resourceGroups/msra-sh-aml-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/msra-sh-aml-uai"
        HF_TOKEN: ${HF_TOKEN}
        GH_TOKEN: ${GH_TOKEN}
        # CODE_TAR_REVISION is set to the freshly packaged tarball asset that CONTAINS
        # data/b2on_v8meta_strict_sft.parquet + configs/sft_b2p_v8meta.yaml (E-071 repackage).
        CODE_TAR_REVISION: "487971950"
        HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN}
        WANDB_API_KEY: ${WANDB_API_KEY}
        WANDB_KEY: ${WANDB_API_KEY}
        WANDB_PROJECT: metacot-math
        WANDB_RUN_GROUP: rq3v2_thinkon
        WANDB_NAME: b2p_v8meta_strict_sft
        WANDB_TAGS: rq3v2,thinkon,v8-parity,qwen3-8b-base,meta-inside-think,whole-response,eos-invariant
        HF_HUB_DISABLE_XET: "1"
        SIMPLERL_DIR: /scratch/conda_envs/simplerl
    command:
      - nvidia-smi
      - |
        bash -c '
        set +e
        set -x
        mkdir -p /scratch/logs /scratch/checkpoints /scratch/models
        cd /scratch
        source /opt/conda/etc/profile.d/conda.sh
        conda activate ptca
        # inline GPU spinner (suspend-on-idle guard from t~0). device=i uses the int
        # CUDA ordinal so NO quote characters are needed inside this bash -c wrapper.
        nohup python -c "
        import torch, time
        g = torch.cuda.device_count()
        ts = [torch.randn(2048, 2048, device=i, dtype=torch.float16) for i in range(g)]
        while True:
            for i in range(g): ts[i] = (ts[i] @ ts[i]) * 0.5
            time.sleep(2)
        " > /scratch/logs/gpu_keeper_inline.log 2>&1 &
        pip install -q "huggingface_hub<1.0" 2>&1 | tail -1

        curl -fsSL -H "Authorization: token $${GH_TOKEN}" -H "Accept: application/octet-stream" -o /tmp/metacognition.tar.gz https://api.github.com/repos/iamseungpil/metacognition-math/releases/assets/$${CODE_TAR_REVISION}
        tar -xzf /tmp/metacognition.tar.gz -C /scratch

        nohup python /scratch/metacognition/scripts/gpu_keeper.py > /scratch/logs/gpu_keeper_early.log 2>&1 &
        bash /scratch/metacognition/scripts/bootstrap_sdc_node.sh
        export PATH="$${SIMPLERL_DIR}/bin:$${PATH}"
        export CONDA_PREFIX="$${SIMPLERL_DIR}"
        # env flag + pip uninstall are INSUFFICIENT -> hard-remove hf_xet (memory hf-xet-pitfall).
        pip uninstall -y hf_xet 2>&1 | tail -1 || true
        find $${SIMPLERL_DIR}/lib -maxdepth 3 -name "hf_xet*" -exec rm -rf {} + 2>/dev/null || true
        python -c "import deepspeed" 2>/dev/null || pip install -q deepspeed 2>&1 | tail -1

        # corpus ships INSIDE the repackaged code tarball (see CODE_TAR_REVISION note).
        ls -l /scratch/metacognition/data/b2on_v8meta_strict_sft.parquet || echo "[YAML][corpus] MISSING b2on_v8meta_strict_sft.parquet - repackage the tarball"

        nohup python /scratch/metacognition/scripts/gpu_keeper.py > /scratch/logs/gpu_keeper.log 2>&1 &
        nohup python /scratch/metacognition/scripts/push_ckpts_to_hf.py --ckpt_dir /scratch/checkpoints/b2p_v8meta_strict_sft --repo_id iamseungpil/metacot --token $${HF_TOKEN} --interval 90 --config_name b2p_v8meta_strict_sft > /scratch/logs/push_b2p.log 2>&1 &

        export PYTHONPATH=/scratch/metacognition
        cd /scratch/metacognition

        python -m accelerate.commands.launch --config_file configs/accelerate_sft.yaml \
            src/training/sft.py --config configs/sft_b2p_v8meta.yaml
        SFT_RC=$$?
        echo "[YAML] b2p-v8meta-sft rc=$${SFT_RC}"

        CKPT=/scratch/checkpoints/b2p_v8meta_strict_sft

        python /scratch/metacognition/scripts/verify_eos_invariant.py $${CKPT}
        EOS_RC=$$?
        echo "[YAML][eos-gate] verify_eos_invariant rc=$${EOS_RC} (0=GREEN required)"
        if [ "$${EOS_RC}" != "0" ]; then
            echo "[YAML][eos-gate] RED checkpoint - terminator mismatch. DO NOT launch RL. Skipping eval, still pushing ckpt for forensics."
        else
            python /scratch/metacognition/scripts/eval_vllm_1030.py \
                --model_path $${CKPT} \
                --model_name b2p_v8meta_term \
                --output_dir /scratch/logs/b2p_term_eval \
                --benchmarks math500 aime2024 \
                --max_problems 100 \
                --max_tokens 8192 \
                --max_model_len 10240 \
                --temperature 1.0 \
                --tp_size 4 \
                --num_samples 2
            EVAL_RC=$$?
            echo "[YAML][term-eval] eval_vllm_1030 rc=$${EVAL_RC} (see b2p_term_eval/*.json: truncation pct <=5 kill-switch, meta_emission_rate >=0.85 target, acc)"
            python /scratch/metacognition/scripts/push_models_hf.py --model_path /scratch/logs/b2p_term_eval --model_name b2p_term_eval --repo_id iamseungpil/metacot 2>&1 | tail -3 || echo "[YAML][term-eval] eval-json push failed (non-fatal)"
        fi

        for i in $$(seq 1 30); do
            python /scratch/metacognition/scripts/push_models_hf.py --model_path $${CKPT} --model_name b2p_v8meta_strict_sft --repo_id iamseungpil/metacot 2>&1 | tail -8
            N=$$(python -c "from huggingface_hub import HfApi;import os;fs=HfApi().list_repo_files(\"iamseungpil/metacot\",repo_type=\"dataset\",token=os.environ[\"HF_TOKEN\"]);print(sum(1 for f in fs if \"b2p_v8meta_strict_sft/model-\" in f and f.endswith(\".safetensors\")))")
            echo "[YAML][push] attempt $$i: shards_on_hf=$$N/4"
            [ "$$N" = "4" ] && echo "[YAML][push] all 4 shards durable on metacot models/" && break
            sleep 120
        done
        sleep 86400
        '
